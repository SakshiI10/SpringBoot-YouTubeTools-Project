<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Video Data Retriever</title>
<script src="https://cdn.tailwindcss.com"></script>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">
<script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1d4ed8'
                        },
                        accent: '#22c55e'
                    }
                }
            }
        };
    </script>
<style>
.main-title {
	background: linear-gradient(90deg, #2563eb, #22c55e);
	-webkit-background-clip: text;
	background-clip: text;
	color: transparent;
}

.gradient-header {
	background: linear-gradient(135deg, rgba(37, 99, 235, .08),
		rgba(34, 197, 94, .08));
	border: 1px dashed #e2e8f0;
}

.thumb-box {
	overflow: hidden;
	border-radius: 0.75rem;
	border: 1px solid #e2e8f0;
}

.desc-box {
	white-space: pre-wrap;
	overflow-wrap: anywhere;
	line-height: 1.7;
	color: #475569;
}

.dark .desc-box {
	color: #cbd5e1;
}

.tag {
	background: rgba(34, 197, 94, 0.15);
	border: 1px solid #e2e8f0;
	border-radius: 9999px;
	transition: transform .1s ease, background .2s ease;
}

.tag:hover {
	transform: translateY(-1px);
	background: rgba(34, 197, 94, 0.22);
}

.error {
	background: rgba(239, 68, 68, 0.12);
	color: #ef4444;
	border-left: 4px solid #ef4444;
}

.dark .gradient-header {
	border-color: #334155;
}

.dark .thumb-box, .dark .tag {
	border-color: #334155;
}
</style>
</head>
<body
	class="bg-slate-50 text-slate-900 min-h-screen transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">

	<div th:replace="~{fragments/navbar :: navbar}"
		th:with="activePage='video'"></div>

	<div class="container mx-auto px-4 max-w-2xl mt-12 pb-12">
		<div class="text-center mb-8">
			<h1 class="main-title text-4xl md:text-5xl font-extrabold mb-4">YouTube
				Video Data Retriever</h1>
			<div class="gradient-header rounded-xl p-4 mt-6">
				<p class="text-slate-600 dark:text-slate-400 text-lg mb-0">
					Enter a YouTube video URL or ID to fetch complete video
					information.</p>
			</div>
		</div>

		<div
			class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg p-6 mb-8 transition-colors duration-300">
			<form th:action="@{/youtube/video-details}" method="post">
				<label for="videoUrlOrId"
					class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
					YouTube Video URL or ID </label> <input type="text" id="videoUrlOrId"
					name="videoUrlOrId"
					class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 mb-4 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 transition-colors duration-200"
					placeholder="Enter YouTube video URL or ID" required
					th:value="${videoUrlOrId}">

				<button type="submit"
					class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg shadow-lg transition-colors duration-200">
					<i class="bi bi-search mr-2"></i>Fetch Video Data
				</button>
			</form>

			<div th:if="${error}" class="error rounded-lg p-4 mt-4"
				th:text="${error}"></div>
		</div>

		<div th:if="${videoDetails != null}">
			<div
				class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg p-6 transition-colors duration-300">
				<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
					<div>
						<div class="thumb-box">
							<img th:src="${videoDetails.thumbnailUrl}"
								th:alt="${videoDetails.title}" class="w-full h-auto block">
						</div>

						<div class="mt-4 flex justify-end">
							<a
								class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors duration-200"
								th:href="${videoDetails.thumbnailUrl}"
								th:download="${videoDetails.title + '-thumb.jpg'}"> <i
								class="bi bi-download mr-1"></i>Download Thumbnail
							</a>
						</div>
					</div>

					<div>
						<h2
							class="font-bold text-slate-900 dark:text-slate-100 mb-2 break-words">
							<i class="bi bi-film text-blue-500"></i> <span
								th:text="${videoDetails.title}"></span>
						</h2>

						<div class="text-slate-600 dark:text-slate-400 mb-4 break-words">
							<div class="mb-2">
								<i class="bi bi-person-video mr-1"></i> <span
									th:text="${videoDetails.channelTitle}"></span>
							</div>
							<div>
								<i class="bi bi-calendar3 mr-1"></i> <span
									th:text="${videoDetails.publishedAt}"></span>
							</div>
						</div>

						<div class="mb-6">
							<h3 class="font-bold mb-2 text-slate-900 dark:text-slate-100">
								<i class="bi bi-text-paragraph text-blue-500 mr-1"></i>Description
							</h3>
							<div class="desc-box"
								th:text="${videoDetails.description != null ? videoDetails.description : 'No description available.'}"></div>
						</div>

						<div>
							<h3 class="font-bold mb-3 text-slate-900 dark:text-slate-100">
								<i class="bi bi-tags text-blue-500 mr-1"></i>Tags
							</h3>

							<div
								th:if="${videoDetails.tags != null and !videoDetails.tags.isEmpty()}">
								<span th:each="tag : ${videoDetails.tags}"
									class="tag inline-flex items-center px-3 py-2 mr-2 mb-2 text-sm text-slate-700 dark:text-slate-200">
									<i class="bi bi-hash mr-1"></i> <span th:text="${tag}"></span>
								</span>
							</div>

							<div
								th:if="${videoDetails.tags == null or videoDetails.tags.isEmpty()}"
								class="text-slate-500 dark:text-slate-400 italic">No tags
								available.</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text)
            .then(() => alert("Copied!"))
            .catch(() => alert("Could not copy text."));
    }
</script>

</body>
</html>
